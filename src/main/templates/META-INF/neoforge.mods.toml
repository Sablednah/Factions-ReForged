modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
displayURL = "https://github.com/Sablednah/Factions-ReForged"
# 256x256 — what the mods list actually draws at. A larger source is jar weight for pixels
# nobody sees.
logoFile = "factions.png"

# Standards is a HARD dependency: the groups seam, the claims seam, Lang, SafeLoc and the
# teleport warmups are all borrowed rather than reimplemented.
[[dependencies.${mod_id}]]
modId = "${standards_mod_id}"
type = "required"
versionRange = "${standards_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
# The NeoForge version, NOT loader_version_range - that is the FML loader spec, which is
# "[1,)" and says nothing about NeoForge. Reusing it here declared no NeoForge floor at
# all; Standards' hard dependency happened to cover for it. See neo_version_min in the
# root gradle.properties: it drops NeoForge's trailing build counter and tracks the
# Minecraft range, so this stays permissive without being meaningless.
versionRange = "[${neo_version_min},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# JourneyMap, for the claims layer — see integration/journeymap.
#
# A TRUE soft dependency: the API is compileOnly and no journeymap class is referenced outside that
# package, so with JourneyMap absent nothing there is ever loaded. This entry only pins the API
# generation and asks the loader to start JourneyMap first.
#
# ⚠ The range is a gradle property because JourneyMap's version strings lead with the Minecraft
# version, so each branch needs its own floor — and an optional dependency whose range is UNMET
# still refuses to load, so a wrong floor stops the mod rather than dropping the layer.
[[dependencies.${mod_id}]]
modId = "journeymap"
type = "optional"
versionRange = "${journeymap_version_range}"
ordering = "AFTER"
side = "BOTH"
