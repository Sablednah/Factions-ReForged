# Generated at build time -- do not edit. See build.gradle's build stamp block.
#
# Namespaced under /factions/ deliberately: a bare /build.properties would collide with every
# other mod doing the same thing on a shared classpath, and you would silently read somebody
# else's stamp. Format agreed with LegendQuest; keep the four field names identical.
commit=${build_commit}
branch=${build_branch}
time=${build_time}
# ⚠ The Minecraft line is part of the answer. mod_version alone is IDENTICAL across all three
# lines, so the stamp and the log line read "1.7.0" on 1.21.11 and on 26.2 alike — the one thing
# they exist to disambiguate. Matches the jar filename's own +mc tag, so both say the same token.
# CityWorld's catch.
version=${mod_version}+mc${minecraft_version}
