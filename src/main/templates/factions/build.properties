# Generated at build time -- do not edit. See build.gradle's build stamp block.
#
# Namespaced under /factions/ deliberately: a bare /build.properties would collide with every
# other mod doing the same thing on a shared classpath, and you would silently read somebody
# else's stamp. Format agreed with LegendQuest; keep the four field names identical.
commit=${build_commit}
branch=${build_branch}
time=${build_time}
version=${mod_version}
