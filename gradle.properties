# Factions-ReForged. Version and metadata for this mod only — everything else (Minecraft version,
# NeoForge version, toolchain) is inherited from the Standards build that drives this one.
factions_mod_id=factions
factions_mod_name=Factions ReForged
# ⚠ 1.6.0 while 1.4.0 is the published release, and that is deliberate — do not "correct" it.
# 1.5.0 -> 1.6.0 because Standards went to 1.8.0 and the derived requirement moved with it: two
# jars both called factions-1.5.0 requiring different Standards versions is the same ambiguity a
# version number exists to remove, even though Factions' own API did not change.
# Bumped when the API grew rather than when the release happens, so that Standards' derived
# requirement on us, and anybody's range, describe something real. See the fifth bug family in
# Standards' CLAUDE.md; it cost three incidents in one day.
factions_mod_version=1.6.0
factions_mod_group_id=com.sablednah.factions
factions_mod_description=Land, allegiance and the people you hold it with. Claim chunks, declare friend or foe, and see exactly where the line is — on a vanilla client.

# JourneyMap, for the claims layer (integration/journeymap only).
#
# ⚠ Two different strings, and they are not interchangeable. The API artifact is what we COMPILE
# against; the version range is what the loader checks at RUNTIME, and JourneyMap's own versions
# lead with the Minecraft version — so the floor differs per branch and has to be a property.
#
# ⚠ An OPTIONAL dependency whose range is UNMET still refuses to load. A wrong floor here does not
# degrade to "no map layer", it stops the mod.
journeymap_api_version=2.0.0-1.21.11
journeymap_version_range=[1.21.11-6.0.0,)
